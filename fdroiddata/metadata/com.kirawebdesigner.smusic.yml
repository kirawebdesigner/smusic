License: GPL-3.0-only
AuthorName: kirawebdesigner
Name: smusic
Summary: Dark-branded video and audio downloader for Android
Description: |
  smusic is an open-source Android video and audio downloader based on yt-dlp.
  It supports searching, direct links, playlists, queues, audio/video formats,
  subtitles, metadata, and public Spotify track, album, and playlist links.
  Spotify links are resolved to artist/title searches and downloaded through
  the existing yt-dlp media pipeline; smusic does not download audio directly
  from Spotify.
