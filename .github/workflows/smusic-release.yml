name: smusic Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  main_project_module: app

jobs:
  build:
    name: Build smusic APKs
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Create temporary release signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/smusic-release.keystore" \
            -storepass smusic-release -keypass smusic-release \
            -alias smusic -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=smusic, OU=smusic, O=smusic, L=Unknown, S=Unknown, C=US"
          cat > keystore.properties <<EOF
          signingConfig.storeFile=$GITHUB_WORKSPACE/smusic-release.keystore
          signingConfig.storePassword=smusic-release
          signingConfig.keyAlias=smusic
          signingConfig.keyPassword=smusic-release
          EOF
          touch local.properties
          chmod +x gradlew

      - name: Run unit tests and build release APKs
        run: ./gradlew testGithubDebugUnitTest assembleGithubRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/github/release/*.apk release-assets/
          sha256sum release-assets/*.apk > release-assets/SHA256SUMS.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smusic-apks
          path: release-assets/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
          body: |
            ## smusic

            Dark-branded media downloader based on YTDLnis, with public Spotify track, album, and playlist link resolution through Spotify's embed metadata and the existing yt-dlp search/download pipeline.

            Install the universal APK on most Android devices. ABI-specific APKs are also included for smaller downloads.
