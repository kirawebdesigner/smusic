name: smusic Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  main_project_module: app

jobs:
  build:
    name: Build smusic APKs
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Configure permanent release signing
        env:
          SMUSIC_KEYSTORE_BASE64: ${{ secrets.SMUSIC_KEYSTORE_BASE64 }}
          SMUSIC_KEYSTORE_PASSWORD: ${{ secrets.SMUSIC_KEYSTORE_PASSWORD }}
          SMUSIC_KEY_ALIAS: ${{ secrets.SMUSIC_KEY_ALIAS }}
          SMUSIC_KEY_PASSWORD: ${{ secrets.SMUSIC_KEY_PASSWORD }}
        run: |
          test -n "$SMUSIC_KEYSTORE_BASE64" || { echo 'Missing SMUSIC_KEYSTORE_BASE64'; exit 1; }
          test -n "$SMUSIC_KEYSTORE_PASSWORD" || { echo 'Missing SMUSIC_KEYSTORE_PASSWORD'; exit 1; }
          test -n "$SMUSIC_KEY_ALIAS" || { echo 'Missing SMUSIC_KEY_ALIAS'; exit 1; }
          test -n "$SMUSIC_KEY_PASSWORD" || { echo 'Missing SMUSIC_KEY_PASSWORD'; exit 1; }
          python3 - <<'PY'
          import base64, os
          value = os.environ['SMUSIC_KEYSTORE_BASE64']
          if value.startswith('SMUSIC_KEYSTORE_BASE64='):
              value = value.split('=', 1)[1]
          value = ''.join(value.split())
          value += '=' * (-len(value) % 4)
          with open(os.path.join(os.environ['GITHUB_WORKSPACE'], 'smusic-release.keystore'), 'wb') as output:
              output.write(base64.b64decode(value, validate=False))
          PY
          keytool -list -keystore "$GITHUB_WORKSPACE/smusic-release.keystore" \
            -storepass "$SMUSIC_KEYSTORE_PASSWORD" -alias "$SMUSIC_KEY_ALIAS" >/dev/null
          cat > keystore.properties <<EOF
          signingConfig.storeFile=$GITHUB_WORKSPACE/smusic-release.keystore
          signingConfig.storePassword=$SMUSIC_KEYSTORE_PASSWORD
          signingConfig.keyAlias=$SMUSIC_KEY_ALIAS
          signingConfig.keyPassword=$SMUSIC_KEY_PASSWORD
          EOF
          touch local.properties
          chmod +x gradlew

      - name: Run unit tests and build release APKs
        run: ./gradlew testGithubDebugUnitTest assembleGithubRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/github/release/*.apk release-assets/
          sha256sum release-assets/*.apk > release-assets/SHA256SUMS.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smusic-apks
          path: release-assets/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
          body: |
            ## smusic

            Dark-branded media downloader based on YTDLnis, with public Spotify track, album, and playlist link resolution through Spotify's embed metadata and the existing yt-dlp search/download pipeline.

            Install the universal APK on most Android devices. ABI-specific APKs are also included for smaller downloads.
